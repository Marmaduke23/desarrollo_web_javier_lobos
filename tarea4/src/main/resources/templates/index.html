<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Sistema de Calificación de Confesiones</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h1 class="text-center mb-4">Sistema de Calificación de Confesiones</h1>

        <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle shadow-sm">
                <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Fecha de inicio</th>
                        <th>Sector</th>
                        <th>Nombre</th>
                        <th>Temas</th>
                        <th>Nota</th>
                        <th>Calificar</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="actividad : ${data}">
                        <td th:text="${actividad.id}"></td>
                        <td th:text="${actividad.dia_hora_inicio}"></td>
                        <td th:text="${actividad.sector}"></td>
                        <td th:text="${actividad.nombre}"></td>
                        <td th:text="${actividad.temas}"></td>
                        <td th:id="'nota-' + ${actividad.id}" th:text="${actividad.nota}"></td>
                        <td>
                            <form class="calificacion-form d-flex align-items-center gap-2" th:action="@{/calificar}" method="post" th:attr="data-id=${actividad.id}">
                                <input type="hidden" name="id" th:value="${actividad.id}" >
                                <select name="nota" class="form-select form-select-sm" required>
                                    <option value="">Nota</option>
                                    <option th:each="i : ${#numbers.sequence(1, 7)}"
                                            th:value="${i}"
                                            th:text="${i}"></option>
                                </select>
                                <button type="submit" class="btn btn-success btn-sm">
                                    <i class="bi bi-check-lg"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    
    <script th:src="@{/js/index.js}"></script>
    

   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
